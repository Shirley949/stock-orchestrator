# trap_corpus — 陷阱形态永久语料（裁决C-1/C-2：陷阱形态进 fixture 才是回归保护，禁散落单元测试）
#
# 单一真相源：每条陷阱形态带实证来源（cron 实锤 / 语料 grep / 构造）；
# 新增陷阱先入 references/trap_ledger.yaml（签名/修法），再在此登记形态 case。
# 消费方：regression-tests/test_diag_contract.py TestTrapCorpus（按 check 字段分发断言）。
#
# schema：
#   id:      唯一（<gate家族>_<形态>_<来源>）
#   gate:    目标门
#   check:   断言分发键（tokenizer_no_percentile_number / g30_first_action / …）
#   line:    报告行原文（逐字，含空格/标点形态）
#   expect:  check 需要的期望值（如 g30_first_action 的期望动作词）
#   source:  实证来源（金安 cron / 语料 grep N 处 / 原型构造）
cases:
  # ---- G63 分位族四形态（批2#1，裁决C-1 逐字取证）----
  - id: g63_pct_space_jinan
    gate: G63
    check: tokenizer_no_percentile_number
    line: "换手率处于 85 分位，量能节奏中性"
    source: "金安 002636 cron 原文形态（N+空格+分位，语料最高频 22 处）——E1 回归锚"
  - id: g63_pct_bai_corpus
    gate: G63
    check: tokenizer_no_percentile_number
    line: "换手率处于 94 百分位，量能节奏中性"
    source: "语料 grep 实锤（94/3/1 百分位 共 7 处现存）——批2#1 主陷阱，修前泄漏"
  - id: g63_pct_bai_di
    gate: G63
    check: tokenizer_no_percentile_number
    line: "换手率处于第99百分位，量能节奏中性"
    source: "原型构造（第N 前缀语料 0 现存，防御覆盖）"
  - id: g63_pct_shu_variant
    gate: G63
    check: tokenizer_no_percentile_number
    line: "换手率处于 94 分位数，量能节奏中性"
    source: "变体（分位数 语料 19 处均无数字直连，防御覆盖）"
  - id: g63_pct_fraction
    gate: G63
    check: tokenizer_no_percentile_number
    line: "换手率处于 99/100 分位，量能节奏中性"
    source: "分数形式（E1 原设计覆盖，回归锚）"
  # ---- G30#1 fatal surface 同义词（批2#5，德福 301511 实锤）----
  - id: g30_surf_dingzeng_defu
    gate: G30
    check: g30_synonym_surface
    line: "定增事项已披露。"
    expect: "增发"          # 快照 fatal event_type；报告同义措辞不漏 surface
    source: "德福 301511 实锤：东财 event_type=增发 × 报告写定增——修前误报『未在时间线 surface』"
  # ---- G30#5 主推荐否定语义 v2 七句评测（批2#2，裁决C-2 口径：5 误判翻转 + 2 回归锚）----
  # 期望判决 = E 类 expected 源（m6-decision/m11-gates 窗语义合同的机器侧锚点）。
  # 窗语义：否定词（不支持/不宜/不建议/不急于/暂不/勿/避免/无加仓）子句内 12 字符窗判否定，
  # 不跨标点（，。；、！？）；紧邻否定词（没有/难以/不再/放弃/拒绝）距动作词 ≤2 字符同判。
  - id: g30_neg_s1_e2_anchor
    gate: G30
    check: g30_first_action
    line: "筹码面不支持现价加仓，持有"
    expect: "持有"
    source: "E2 回归锚（金安句式）：修前持有被前半句不支持跨标点误杀返 None→v2 标点截断后持有"
  - id: g30_neg_s2_anchor
    gate: G30
    check: g30_first_action
    line: "趋势持有，逢低吸纳后再加仓"
    expect: "趋势持有"
    source: "回归锚：首动作词即答案，v2 不得回退（裁决C-2：want=持有 与 趋势持有 同为合法动作词，语义等价）"
  - id: g30_neg_s3_meiyou
    gate: G30
    check: g30_first_action
    line: "筹码面没有加仓基础，建议持有"
    expect: "持有"
    source: "误判翻转①：没有 不在旧否定词表，加仓 被当主推荐→紧邻否定词 ≤2 字符判否定"
  - id: g30_neg_s4_nanyi
    gate: G30
    check: g30_first_action
    line: "短期难以加仓，维持持有"
    expect: "持有"
    source: "误判翻转②：难以 同上"
  - id: g30_neg_s5_fangqi
    gate: G30
    check: g30_first_action
    line: "估值已高，放弃加仓，持有为主"
    expect: "持有"
    source: "误判翻转③：放弃 同上"
  - id: g30_neg_s6_jujue
    gate: G30
    check: g30_first_action
    line: "筹码压力仍存，拒绝追高加仓，建议持有"
    expect: "持有"
    source: "误判翻转④：拒绝 同上"
  - id: g30_neg_s7_buzai
    gate: G30
    check: g30_first_action
    line: "市场情绪未稳，不再加仓，持有观望"
    expect: "持有"
    source: "误判翻转⑤：不再 同上"
  # ---- G21 registry did-you-mean（批2#4，裁决C：scene 缺失 [数据层] 家族）----
  # line 此处=坏 [src:] 路径；expect=提示语必含子串。
  - id: g21_scene_missing_datalayer
    gate: G21
    check: g21_registry_hint
    line: "valuation_snapshot.data.quote"
    expect: "[数据层] scene「valuation_snapshot」在注册表而本快照未生成"
    source: "模式B/未拉取 scene 引用形态：修前退化裸路径报错无建议→修后数据层归因（查快照生成，非拼写）"
  - id: g21_typo_registry_neighbor
    gate: G21
    check: g21_registry_hint
    line: "valuation_snapsho.data.quote"
    expect: "registry 近邻 scene「valuation_snapshot」"
    source: "第1层拼写错且兄弟键无近邻时由 data_contracts.SCENES 权威注册表补建议"
